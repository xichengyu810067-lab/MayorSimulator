          try {
            $manifest = Get-Content -LiteralPath sdk/manifest.json -Raw | ConvertFrom-Json
            $contract = Get-Content -LiteralPath .mayor-sdk.json -Raw | ConvertFrom-Json
            $version = [version]$manifest.sdk_version
          } catch { throw 'SDK checkout mismatch.' }
          if ($contract.sdk_version_range -cne '>=1.2.2 <2.0.0' -or
              $version -lt [version]'1.2.2' -or $version -ge [version]'2.0.0') {
            throw 'SDK checkout mismatch.'
          }

      - name: Download and verify Godot editor and export templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci/editor .ci/templates
          base_url="https://github.com/godotengine/godot-builds/releases/download/${GODOT_RELEASE}"
          curl --fail --location --retry 4 --output ".ci/${GODOT_LINUX_ARCHIVE}" "${base_url}/${GODOT_LINUX_ARCHIVE}"
          curl --fail --location --retry 4 --output ".ci/${GODOT_TEMPLATES_ARCHIVE}" "${base_url}/${GODOT_TEMPLATES_ARCHIVE}"
          echo "${GODOT_LINUX_SHA256}  .ci/${GODOT_LINUX_ARCHIVE}" | sha256sum --check --strict
          echo "${GODOT_TEMPLATES_SHA256}  .ci/${GODOT_TEMPLATES_ARCHIVE}" | sha256sum --check --strict
          unzip -q ".ci/${GODOT_LINUX_ARCHIVE}" -d .ci/editor
          unzip -q ".ci/${GODOT_TEMPLATES_ARCHIVE}" -d .ci/templates
          chmod +x .ci/editor/Godot_v4.7-stable_linux.x86_64
          template_root="${HOME}/.local/share/godot/export_templates/${GODOT_TEMPLATE_VERSION}"
          mkdir -p "${template_root}"
          cp -a .ci/templates/templates/. "${template_root}/"
          test -f "${template_root}/windows_release_x86_64.exe"
          test -f "${template_root}/linux_release.x86_64"

      - name: Import and export release packages
        shell: bash
        run: |
          set -euo pipefail
          godot=.ci/editor/Godot_v4.7-stable_linux.x86_64
          mkdir -p builds/windows builds/linux
          "${godot}" --headless --path . --import
          "${godot}" --headless --path . --export-release "Windows Desktop" builds/windows/MayorSimulator.exe
          "${godot}" --headless --path . --export-release Linux builds/linux/MayorSimulator.x86_64
          test -s builds/windows/MayorSimulator.exe
          test -s builds/windows/MayorSimulator.pck
          test -s builds/linux/MayorSimulator.x86_64
          test -s builds/linux/MayorSimulator.pck
          chmod +x builds/linux/MayorSimulator.x86_64
          cp RELEASE_README.txt builds/windows/
          cp RELEASE_README.txt builds/linux/
          cp THIRD_PARTY_NOTICES.md builds/windows/
          cp THIRD_PARTY_NOTICES.md builds/linux/
          cp GODOT_COPYRIGHT.txt builds/windows/
          cp GODOT_COPYRIGHT.txt builds/linux/
          cp LICENSE.txt builds/windows/
          cp LICENSE.txt builds/linux/
          cp TERMS_OF_USE.md builds/windows/
          cp TERMS_OF_USE.md builds/linux/
          cp PRIVACY_NOTICE.md builds/windows/
          cp PRIVACY_NOTICE.md builds/linux/

      - name: Verify packed resource inventory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $godot = Join-Path $PWD '.ci/editor/Godot_v4.7-stable_linux.x86_64'
          $inventoryRoot = Join-Path $env:RUNNER_TEMP 'pck-inventory'
          New-Item -ItemType Directory -Path $inventoryRoot -ErrorAction Stop | Out-Null
          foreach ($item in @(
              [pscustomobject]@{ Pack = 'builds/windows/MayorSimulator.pck'; Inventory = 'windows.txt' },
              [pscustomobject]@{ Pack = 'builds/linux/MayorSimulator.pck'; Inventory = 'linux.txt' }
          )) {
            $scannerOutput = @(& pwsh -NoProfile -File ./tools/inspect_pck_inventory.ps1 `
              -GodotExe $godot `
              -PackPath $item.Pack `
              -OutputPath (Join-Path $inventoryRoot $item.Inventory) 2>&1)
            if ($LASTEXITCODE -ne 0) {
              throw "PCK inventory failed: $($item.Pack)"
            }
            if (@($scannerOutput | Where-Object { $_ -match '^PCK_INVENTORY_OK entries=[1-9][0-9]* sha256=[0-9a-f]{64}$' }).Count -ne 1) {
              throw "PCK inventory success marker is missing or ambiguous: $($item.Pack)"
            }
          }

      - name: Smoke-test Linux export
        shell: bash
        run: |
          set -euo pipefail
          timeout 60s builds/linux/MayorSimulator.x86_64 --headless -- --qa-release-smoke-frames=120 > .ci/linux-startup.log 2>&1
          grep -Fxq 'QA_RELEASE_SMOKE_ARMED frames=120' .ci/linux-startup.log
          grep -Fxq 'QA_RELEASE_SMOKE_COMPLETED' .ci/linux-startup.log
          if grep -Eq '^(SCRIPT ERROR|ERROR):|ObjectDB instances? .* leaked|resources? still in use at exit|Leaked instance:' .ci/linux-startup.log; then
            echo 'Linux release smoke emitted disallowed product diagnostics.' >&2
            exit 1
          fi

      - name: Package release artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./tools/package_release.ps1 `
            -Version $env:RELEASE_VERSION `
            -OutputDirectory "builds/release-$env:RELEASE_VERSION"

      - name: Write machine-readable release evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseRoot = "builds/release-$env:RELEASE_VERSION"
          $files = [ordered]@{}
          foreach ($relativePath in @(
              'builds/windows/MayorSimulator.exe',
              'builds/windows/MayorSimulator.pck',
              'builds/windows/RELEASE_README.txt',
              'builds/windows/THIRD_PARTY_NOTICES.md',
              'builds/windows/GODOT_COPYRIGHT.txt',
              'builds/windows/LICENSE.txt',
              'builds/windows/TERMS_OF_USE.md',
              'builds/windows/PRIVACY_NOTICE.md',
              'builds/linux/MayorSimulator.x86_64',
              'builds/linux/MayorSimulator.pck',
              'builds/linux/RELEASE_README.txt',
              'builds/linux/THIRD_PARTY_NOTICES.md',
              'builds/linux/GODOT_COPYRIGHT.txt',
              'builds/linux/LICENSE.txt',
              'builds/linux/TERMS_OF_USE.md',
              'builds/linux/PRIVACY_NOTICE.md',
              "$releaseRoot/MayorSimulator-Windows-x86_64-$env:RELEASE_VERSION.zip",
              "$releaseRoot/MayorSimulator-Linux-x86_64-$env:RELEASE_VERSION.tar.gz",
              "$releaseRoot/SHA256SUMS",
              '.ci/linux-startup.log'
          )) {
            if (-not (Test-Path -LiteralPath $relativePath -PathType Leaf)) {
              throw "Release evidence input is missing: $relativePath"
            }
            $item = Get-Item -LiteralPath $relativePath
            $files[$relativePath.Replace('\\', '/')] = [ordered]@{
              bytes = $item.Length
              sha256 = (Get-FileHash -LiteralPath $relativePath -Algorithm SHA256).Hash.ToLowerInvariant()
            }
          }
          $evidence = [ordered]@{
            schema_version = 1
            generated_at_utc = [DateTimeOffset]::UtcNow.ToString('o')
            source_ref = $env:GITHUB_REF
            source_sha = $env:GITHUB_SHA
            workflow_run_id = $env:GITHUB_RUN_ID
            workflow_run_attempt = $env:GITHUB_RUN_ATTEMPT
            release_version = $env:RELEASE_VERSION
            engine_release = $env:GODOT_RELEASE
            linux_editor_archive_sha256 = $env:GODOT_LINUX_SHA256
            templates_archive_sha256 = $env:GODOT_TEMPLATES_SHA256
            assertion_matrix_dependency = 'success'
            commands = [ordered]@{
              import = 'godot --headless --path . --import'
              windows_export = "godot --headless --path . --export-release 'Windows Desktop' builds/windows/MayorSimulator.exe"
              linux_export = "godot --headless --path . --export-release Linux builds/linux/MayorSimulator.x86_64"
              linux_smoke = 'MayorSimulator.x86_64 --headless -- --qa-release-smoke-frames=120'
              package = "tools/package_release.ps1 -Version $env:RELEASE_VERSION -OutputDirectory $releaseRoot"
            }
            exit_codes = [ordered]@{
              import = 0
              windows_export = 0
              linux_export = 0
              linux_smoke = 0
              package = 0
            }
            required_smoke_markers = @('QA_RELEASE_SMOKE_ARMED frames=120', 'QA_RELEASE_SMOKE_COMPLETED')
            files = $files
          }
          $evidence | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath '.ci/release-evidence.json' -Encoding utf8NoBOM

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: MayorSimulator-${{ env.RELEASE_VERSION }}-${{ github.run_number }}
          path: |
            builds/release-${{ env.RELEASE_VERSION }}/MayorSimulator-Windows-x86_64-${{ env.RELEASE_VERSION }}.zip
            builds/release-${{ env.RELEASE_VERSION }}/MayorSimulator-Linux-x86_64-${{ env.RELEASE_VERSION }}.tar.gz
            builds/release-${{ env.RELEASE_VERSION }}/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
