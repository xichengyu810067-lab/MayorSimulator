name: Godot 4.7 verification

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_version:
        description: SemVer release version without the v prefix (must match VERSION)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: godot-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_RELEASE: 4.7-stable
  GODOT_TEMPLATE_VERSION: 4.7.stable
  GODOT_WINDOWS_ARCHIVE: Godot_v4.7-stable_win64.exe.zip
  GODOT_WINDOWS_SHA256: 02a5312236f4e0209c78bcb2f52135b1963e6b8888c873c9cee81459e60bcd71
  GODOT_LINUX_ARCHIVE: Godot_v4.7-stable_linux.x86_64.zip
  GODOT_LINUX_SHA256: 0b1a6c54c2c619c12e169fe9241edda4b81080b519451cec2984bf0d2c6cb73c
  GODOT_TEMPLATES_ARCHIVE: Godot_v4.7-stable_export_templates.tpz
  GODOT_TEMPLATES_SHA256: 9714459dc071907c0f3d5f17d608faf69e7cda21331fc5d39c4503ffa4e99eec

jobs:
  assertion-matrix:
    name: Assertion matrix (Windows)
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: false
          token: ${{ github.token }}
          persist-credentials: false

      - name: Validate pinned SDK source and access
        id: sdk-source
        shell: pwsh
        env:
          SDK_TOKEN_PRESENT: ${{ secrets.SDK_REPOSITORY_READ_TOKEN != '' }}
          TRUSTED_SOURCE: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($IsWindows) {
            $gitRoot = Split-Path (Split-Path (Get-Command git).Source -Parent) -Parent
            $gitTools = Join-Path $gitRoot 'usr\bin'
            $gitExec = (& git --exec-path).Trim()
            $env:Path = $gitTools + [IO.Path]::PathSeparator + $gitExec + [IO.Path]::PathSeparator + $env:Path
          }
          if ($env:TRUSTED_SOURCE -ne 'true' -or $env:SDK_TOKEN_PRESENT -ne 'true') {
            throw 'SDK checkout unavailable.'
          }
          $entry = @(& git ls-tree HEAD -- sdk 2>$null)
          if ($LASTEXITCODE -ne 0 -or $entry.Count -ne 1 -or $entry[0] -cnotmatch '^160000 commit ([0-9a-f]{40})\tsdk$') {
            throw 'SDK source contract mismatch.'
          }
          $sdkPin = $Matches[1]
          $mapping = @(& git config -f .gitmodules --list 2>$null)
          if ($LASTEXITCODE -ne 0 -or $mapping.Count -ne 2 -or
              $mapping -cnotcontains 'submodule.sdk.path=sdk' -or
              $mapping -cnotcontains 'submodule.sdk.url=https://github.com/xichengyu810067-lab/MayorSimulator-SDK.git') {
            throw 'SDK source contract mismatch.'
          }
          try { $contract = Get-Content -LiteralPath .mayor-sdk.json -Raw | ConvertFrom-Json }
          catch { throw 'SDK source contract mismatch.' }
          if ($contract.sdk_repository -cne 'xichengyu810067-lab/MayorSimulator-SDK' -or $contract.integration_path -cne 'sdk') {
            throw 'SDK source contract mismatch.'
          }
          & git submodule init -- sdk *> $null
          if ($LASTEXITCODE -ne 0) { throw 'SDK source contract mismatch.' }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "sha=$sdkPin"

      - name: Check out pinned SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: xichengyu810067-lab/MayorSimulator-SDK
          path: sdk
          ref: ${{ steps.sdk-source.outputs.sha }}
          token: ${{ secrets.SDK_REPOSITORY_READ_TOKEN }}
          submodules: false
          persist-credentials: false

      - name: Verify pinned SDK checkout
        shell: pwsh
        env:
          SDK_PIN: ${{ steps.sdk-source.outputs.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($IsWindows) {
            $gitRoot = Split-Path (Split-Path (Get-Command git).Source -Parent) -Parent
            $gitTools = Join-Path $gitRoot 'usr\bin'
            $gitExec = (& git --exec-path).Trim()
            $env:Path = $gitTools + [IO.Path]::PathSeparator + $gitExec + [IO.Path]::PathSeparator + $env:Path
          }
          $actual = (& git -C sdk rev-parse HEAD 2>$null)
          $status = @(& git submodule status -- sdk 2>$null)
          if ($actual -cne $env:SDK_PIN -or $LASTEXITCODE -ne 0 -or $status.Count -ne 1 -or
              $status[0] -cnotmatch ('^ ' + [regex]::Escape($env:SDK_PIN) + ' sdk(?: .*)?$')) {
            throw 'SDK checkout mismatch.'
          }
          try {
            $manifest = Get-Content -LiteralPath sdk/manifest.json -Raw | ConvertFrom-Json
            $contract = Get-Content -LiteralPath .mayor-sdk.json -Raw | ConvertFrom-Json
            $version = [version]$manifest.sdk_version
          } catch { throw 'SDK checkout mismatch.' }
          if ($contract.sdk_version_range -cne '>=1.2.2 <2.0.0' -or
              $version -lt [version]'1.2.2' -or $version -ge [version]'2.0.0') {
            throw 'SDK checkout mismatch.'
          }

      - name: Validate Mayor Simulator SDK contracts
        shell: pwsh
        run: |
          python sdk/mayor_sdk.py self-test
          python -m unittest discover -s tests/sdk -p 'test_*.py'

      - name: Download and verify Godot editor
        id: godot
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $archive = Join-Path $env:RUNNER_TEMP $env:GODOT_WINDOWS_ARCHIVE
          $url = "https://github.com/godotengine/godot-builds/releases/download/$env:GODOT_RELEASE/$env:GODOT_WINDOWS_ARCHIVE"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:GODOT_WINDOWS_SHA256) {
            throw "Godot editor SHA-256 mismatch: $actual"
          }
          $editorRoot = Join-Path $env:RUNNER_TEMP 'godot-editor'
          Expand-Archive -LiteralPath $archive -DestinationPath $editorRoot -Force
          $console = Get-ChildItem -LiteralPath $editorRoot -Filter '*_console.exe' -File | Select-Object -First 1
          if ($null -eq $console) {
            throw 'Godot console executable was not found after extraction.'
          }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "godot_exe=$($console.FullName)"

      - name: Import project assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & '${{ steps.godot.outputs.godot_exe }}' --headless --path . --import
          if ($LASTEXITCODE -ne 0) {
            throw "Godot import failed with exit code $LASTEXITCODE."
          }

      - name: Run isolated assertion manifest
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'assertion-matrix'
          & pwsh -NoProfile -File tools/run_assertion_matrix.ps1 `
            -GodotExe '${{ steps.godot.outputs.godot_exe }}' `
            -ManifestPath tests/assertion_matrix.json `
            -OutputRoot $output

      - name: Run OS-kill save durability QA
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'save-os-kill-qa'
          & pwsh -NoProfile -File tools/run_save_os_kill_qa.ps1 `
            -GodotExe '${{ steps.godot.outputs.godot_exe }}' `
            -OutputRoot $output


  release-version:
    name: Resolve and validate release metadata
    needs: assertion-matrix
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_version: ${{ steps.metadata.outputs.release_version }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: false
          token: ${{ github.token }}
          persist-credentials: false

      - name: Validate source ref and export metadata
        id: metadata
        shell: bash
        env:
          DISPATCH_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            release_version="${GITHUB_REF_NAME#v}"
          else
            release_version="${DISPATCH_VERSION}"
          fi

          semver_pattern='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "${release_version}" =~ ${semver_pattern} ]]; then
            echo "Release version must be valid SemVer without a v prefix: ${release_version}" >&2
            exit 1
          fi

          project_version="$(tr -d '\r\n' < VERSION)"
          if [[ "${project_version}" != "${release_version}" ]]; then
            echo "Release version ${release_version} does not match canonical VERSION ${project_version}." >&2
            exit 1
          fi
          if [[ "${GITHUB_REF}" == refs/tags/v* && "${GITHUB_REF_NAME}" != "v${project_version}" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} must exactly equal v${project_version}." >&2
            exit 1
          fi

          core_version="${project_version%%[-+]*}"
          IFS='.' read -r major minor patch <<< "${core_version}"
          windows_version="${major}.${minor}.${patch}.0"

          mapfile -t file_versions < <(sed -n 's/^application\/file_version="\([^"]*\)"$/\1/p' export_presets.cfg)
          mapfile -t product_versions < <(sed -n 's/^application\/product_version="\([^"]*\)"$/\1/p' export_presets.cfg)
          if [[ ${#file_versions[@]} -ne 1 || ${#product_versions[@]} -ne 1 ]]; then
            echo 'Expected exactly one Windows file_version and product_version in export_presets.cfg.' >&2
            exit 1
          fi
          if [[ "${file_versions[0]}" != "${windows_version}" || "${product_versions[0]}" != "${windows_version}" ]]; then
            echo "Release ${release_version} requires Windows metadata ${windows_version}; found file=${file_versions[0]} product=${product_versions[0]}." >&2
            exit 1
          fi

          echo "release_version=${release_version}" >> "${GITHUB_OUTPUT}"
          echo "Validated SemVer release ${release_version}, tag/ref ${GITHUB_REF}, and Windows metadata ${windows_version}." >> "${GITHUB_STEP_SUMMARY}"

  windows-export-smoke:
    name: Exported Windows executable smoke test
    needs: release-version
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      RELEASE_VERSION: ${{ needs.release-version.outputs.release_version }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: false
          token: ${{ github.token }}
          persist-credentials: false

      - name: Validate pinned SDK source and access
        id: sdk-source
        shell: pwsh
        env:
          SDK_TOKEN_PRESENT: ${{ secrets.SDK_REPOSITORY_READ_TOKEN != '' }}
          TRUSTED_SOURCE: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($IsWindows) {
            $gitRoot = Split-Path (Split-Path (Get-Command git).Source -Parent) -Parent
            $gitTools = Join-Path $gitRoot 'usr\bin'
            $gitExec = (& git --exec-path).Trim()
            $env:Path = $gitTools + [IO.Path]::PathSeparator + $gitExec + [IO.Path]::PathSeparator + $env:Path
          }
          if ($env:TRUSTED_SOURCE -ne 'true' -or $env:SDK_TOKEN_PRESENT -ne 'true') {
            throw 'SDK checkout unavailable.'
          }
          $entry = @(& git ls-tree HEAD -- sdk 2>$null)
          if ($LASTEXITCODE -ne 0 -or $entry.Count -ne 1 -or $entry[0] -cnotmatch '^160000 commit ([0-9a-f]{40})\tsdk$') {
            throw 'SDK source contract mismatch.'
          }
          $sdkPin = $Matches[1]
          $mapping = @(& git config -f .gitmodules --list 2>$null)
          if ($LASTEXITCODE -ne 0 -or $mapping.Count -ne 2 -or
              $mapping -cnotcontains 'submodule.sdk.path=sdk' -or
              $mapping -cnotcontains 'submodule.sdk.url=https://github.com/xichengyu810067-lab/MayorSimulator-SDK.git') {
            throw 'SDK source contract mismatch.'
          }
          try { $contract = Get-Content -LiteralPath .mayor-sdk.json -Raw | ConvertFrom-Json }
          catch { throw 'SDK source contract mismatch.' }
          if ($contract.sdk_repository -cne 'xichengyu810067-lab/MayorSimulator-SDK' -or $contract.integration_path -cne 'sdk') {
            throw 'SDK source contract mismatch.'
          }
          & git submodule init -- sdk *> $null
          if ($LASTEXITCODE -ne 0) { throw 'SDK source contract mismatch.' }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "sha=$sdkPin"

      - name: Check out pinned SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: xichengyu810067-lab/MayorSimulator-SDK
          path: sdk
          ref: ${{ steps.sdk-source.outputs.sha }}
          token: ${{ secrets.SDK_REPOSITORY_READ_TOKEN }}
          submodules: false
          persist-credentials: false

      - name: Verify pinned SDK checkout
        shell: pwsh
        env:
          SDK_PIN: ${{ steps.sdk-source.outputs.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($IsWindows) {
            $gitRoot = Split-Path (Split-Path (Get-Command git).Source -Parent) -Parent
            $gitTools = Join-Path $gitRoot 'usr\bin'
            $gitExec = (& git --exec-path).Trim()
            $env:Path = $gitTools + [IO.Path]::PathSeparator + $gitExec + [IO.Path]::PathSeparator + $env:Path
          }
          $actual = (& git -C sdk rev-parse HEAD 2>$null)
          $status = @(& git submodule status -- sdk 2>$null)
          if ($actual -cne $env:SDK_PIN -or $LASTEXITCODE -ne 0 -or $status.Count -ne 1 -or
              $status[0] -cnotmatch ('^ ' + [regex]::Escape($env:SDK_PIN) + ' sdk(?: .*)?$')) {
            throw 'SDK checkout mismatch.'
          }
          try {
            $manifest = Get-Content -LiteralPath sdk/manifest.json -Raw | ConvertFrom-Json
            $contract = Get-Content -LiteralPath .mayor-sdk.json -Raw | ConvertFrom-Json
            $version = [version]$manifest.sdk_version
          } catch { throw 'SDK checkout mismatch.' }
          if ($contract.sdk_version_range -cne '>=1.2.2 <2.0.0' -or
              $version -lt [version]'1.2.2' -or $version -ge [version]'2.0.0') {
            throw 'SDK checkout mismatch.'
          }

      - name: Download and verify Windows editor and templates
        id: windows-godot
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $baseUrl = "https://github.com/godotengine/godot-builds/releases/download/$env:GODOT_RELEASE"
          $editorArchive = Join-Path $env:RUNNER_TEMP $env:GODOT_WINDOWS_ARCHIVE
          $templateArchive = Join-Path $env:RUNNER_TEMP $env:GODOT_TEMPLATES_ARCHIVE
          Invoke-WebRequest -Uri "$baseUrl/$env:GODOT_WINDOWS_ARCHIVE" -OutFile $editorArchive
          Invoke-WebRequest -Uri "$baseUrl/$env:GODOT_TEMPLATES_ARCHIVE" -OutFile $templateArchive
          $editorHash = (Get-FileHash -LiteralPath $editorArchive -Algorithm SHA256).Hash.ToLowerInvariant()
          $templateHash = (Get-FileHash -LiteralPath $templateArchive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($editorHash -ne $env:GODOT_WINDOWS_SHA256) { throw "Godot editor SHA-256 mismatch: $editorHash" }
          if ($templateHash -ne $env:GODOT_TEMPLATES_SHA256) { throw "Godot templates SHA-256 mismatch: $templateHash" }

          $editorRoot = Join-Path $env:RUNNER_TEMP 'godot-windows-editor'
          Expand-Archive -LiteralPath $editorArchive -DestinationPath $editorRoot -Force
          $console = Get-ChildItem -LiteralPath $editorRoot -Filter '*_console.exe' -File | Select-Object -First 1
          if ($null -eq $console) { throw 'Godot console executable was not found after extraction.' }

          $templateZip = Join-Path $env:RUNNER_TEMP 'godot-export-templates.zip'
          Copy-Item -LiteralPath $templateArchive -Destination $templateZip
          $templateExtract = Join-Path $env:RUNNER_TEMP 'godot-export-templates'
          Expand-Archive -LiteralPath $templateZip -DestinationPath $templateExtract -Force
          $templateSource = Join-Path $templateExtract 'templates'
          $templateTarget = Join-Path (Join-Path $env:APPDATA 'Godot\export_templates') $env:GODOT_TEMPLATE_VERSION
          New-Item -ItemType Directory -Path $templateTarget -Force | Out-Null
          Copy-Item -Path (Join-Path $templateSource '*') -Destination $templateTarget -Recurse -Force
          if (-not (Test-Path -LiteralPath (Join-Path $templateTarget 'windows_release_x86_64.exe') -PathType Leaf)) {
            throw 'Windows release export template was not installed.'
          }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "godot_exe=$($console.FullName)"

      - name: Export and smoke-test Windows executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $godot = '${{ steps.windows-godot.outputs.godot_exe }}'
          $outputRoot = Join-Path $env:RUNNER_TEMP 'windows-export'
          New-Item -ItemType Directory -Path $outputRoot -Force | Out-Null
          & $godot --headless --path . --import
          if ($LASTEXITCODE -ne 0) { throw "Godot import failed with exit code $LASTEXITCODE." }
          $exported = Join-Path $outputRoot 'MayorSimulator.exe'
          & $godot --headless --path . --export-release 'Windows Desktop' $exported
          if ($LASTEXITCODE -ne 0) { throw "Windows export failed with exit code $LASTEXITCODE." }
          $pck = Join-Path $outputRoot 'MayorSimulator.pck'
          if (-not (Test-Path -LiteralPath $exported -PathType Leaf) -or -not (Test-Path -LiteralPath $pck -PathType Leaf)) {
            throw 'Windows export did not produce the expected EXE and PCK.'
          }

          $log = Join-Path $outputRoot 'windows-release-smoke.log'
          $smokeOutput = & $exported --headless -- --qa-release-smoke-frames=120 2>&1 | Out-String
          $smokeExitCode = $LASTEXITCODE
          [IO.File]::WriteAllText($log, $smokeOutput, [Text.UTF8Encoding]::new($false))
          if ($smokeExitCode -ne 0) { throw "Exported Windows smoke test failed with exit code $smokeExitCode." }
          $logLines = @(Get-Content -LiteralPath $log)
          if (-not $logLines.Contains('QA_RELEASE_SMOKE_ARMED frames=120') -or -not $logLines.Contains('QA_RELEASE_SMOKE_COMPLETED')) {
            throw 'Exported Windows smoke markers are incomplete.'
          }
          $disallowed = @($logLines | Where-Object {
              ($_ -match '^(SCRIPT ERROR|ERROR):|ObjectDB instances? .* leaked|resources? still in use at exit|Leaked instance:') -and
              ($_ -notmatch '^ERROR: Failed to read the root certificate store')
          })
          if ($disallowed.Count -gt 0) { throw 'Exported Windows smoke log contains disallowed product diagnostics.' }

          $evidence = [ordered]@{
            schema_version = 1
            source_ref = $env:GITHUB_REF
            source_sha = $env:GITHUB_SHA
            release_version = $env:RELEASE_VERSION
            engine_release = $env:GODOT_RELEASE
            editor_archive_sha256 = $env:GODOT_WINDOWS_SHA256
            templates_archive_sha256 = $env:GODOT_TEMPLATES_SHA256
            export_command = "godot --headless --path . --export-release 'Windows Desktop' <runner-temp>/windows-export/MayorSimulator.exe"
            smoke_command = 'MayorSimulator.exe --headless -- --qa-release-smoke-frames=120'
            smoke_exit_code = $smokeExitCode
            markers = @('QA_RELEASE_SMOKE_ARMED frames=120', 'QA_RELEASE_SMOKE_COMPLETED')
            executable = [ordered]@{
              bytes = (Get-Item -LiteralPath $exported).Length
              sha256 = (Get-FileHash -LiteralPath $exported -Algorithm SHA256).Hash.ToLowerInvariant()
            }
            pck = [ordered]@{
              bytes = (Get-Item -LiteralPath $pck).Length
              sha256 = (Get-FileHash -LiteralPath $pck -Algorithm SHA256).Hash.ToLowerInvariant()
            }
            log_sha256 = (Get-FileHash -LiteralPath $log -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          $evidence | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath (Join-Path $outputRoot 'windows-release-evidence.json') -Encoding utf8NoBOM


  release-exports:
    name: Windows and Linux release exports
    needs: release-version
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RELEASE_VERSION: ${{ needs.release-version.outputs.release_version }}

    steps:
      - name: Check out source
